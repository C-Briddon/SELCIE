name: SELCIE

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - fenics=2019.1.0
  - mpich  # Required for Apple Silicon (avoids OpenMPI crash)
  - meshio=4.3.8
  - matplotlib
  - astropy
  - numpy<2.0
  - scipy
  - pip

  - pip:
    - gmsh==4.13.1
    # Required for Apple Silicon - conda fenics package has broken deps
    - fenics-ufl==2019.1.0
    - fenics-ffc==2019.1.0
    - fenics-fiat==2019.1.0
    - fenics-dijitso==2019.1.0